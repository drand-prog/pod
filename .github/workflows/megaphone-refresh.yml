name: Refresh Megaphone data

# Pulls newly finalized days from Megaphone's Delivery Export (S3) and folds
# them into data/raw/, then lets rebuild-dashboard.yml pick up the change.
# Runs daily rather than monthly since Megaphone finalizes each day's export
# by ~11am UTC and there's no reason to let a working pipeline sit idle for
# weeks — see scripts/fetch_megaphone.py's docstring for how this works and
# why it can only append forward (the export has no backfill).
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION
#       - credentials for an IAM user/role scoped to READ ONLY on the export
#         bucket (s3:GetObject + s3:ListBucket on that bucket alone) — see
#         the README's Automation section for the exact policy shape.
#   MEGAPHONE_S3_BUCKET
#       - the bucket Megaphone was configured to write delivery exports to.
# Optional:
#   MEGAPHONE_S3_PREFIX - key prefix, if exports aren't at the bucket root.

on:
  schedule:
    - cron: "30 12 * * *" # daily, after Megaphone finalizes the previous day (~11:00 UTC)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install openpyxl boto3

      - name: Pull new finalized days from S3
        id: fetch
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          MEGAPHONE_S3_BUCKET: ${{ secrets.MEGAPHONE_S3_BUCKET }}
          MEGAPHONE_S3_PREFIX: ${{ secrets.MEGAPHONE_S3_PREFIX }}
        run: python3 scripts/fetch_megaphone.py

      - run: python3 scripts/build_data.py

      - name: Open PR with refreshed data
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Refresh Megaphone data (automated)"
          title: "Automated Megaphone data refresh"
          body: |
            New finalized day(s) pulled from Megaphone's Delivery Export (S3) by the
            scheduled `megaphone-refresh` workflow and folded into the existing
            history — see the workflow run log for exactly which dates and counts.

            Review before merging: this bumps the Megaphone downloads trend, the
            by-app breakdown, and everything derived from them (the "Other
            platforms" residual, the totals-differ caveat, and the Megaphone
            period labels).
          branch: automated/megaphone-refresh
          delete-branch: true
